[project]
name = "penarm"
version = "0.1.0"
description = "MCP server driving a 2-link pen-plotter arm through an ESP32"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyserial>=3.5",
    "svgelements>=1.9.6",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "types-pyserial"]

[project.scripts]
penarm-mcp = "penarm.server:main"
penarm-markers = "penarm.vision:markers_main"
penarm-inkcal = "penarm.inkcal:main"

[project.optional-dependencies]
vision = [
    "numpy>=2.4.6",
    "opencv-python-headless>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penarm"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["svgelements"]
ignore_missing_imports = true  # third-party library without type stubs

[tool.pytest.ini_options]
pythonpath = ["."]
