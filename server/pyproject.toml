[project]
name = "penarm"
version = "0.1.0"
description = "MCP server driving a 2-link pen-plotter arm through an ESP32"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyserial>=3.5",
    "svgelements>=1.9.6",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-pyserial"]
deck = ["python-pptx", "pillow"]  # only to rebuild the workshop slides

[project.scripts]
penarm-mcp = "penarm.server:main"
penarm-calibrate = "penarm.calibrate:main"
penarm-assemble = "penarm.assemble:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penarm"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["svgelements"]
ignore_missing_imports = true  # third-party library without type stubs

[tool.pytest.ini_options]
pythonpath = ["."]
