[env]
framework = arduino
monitor_speed = 57600

[esp32_base]
platform = espressif32@8.0.0  ; pinned: the versions the firmware was built and verified with
board = esp32dev
lib_deps = madhephaestus/ESP32Servo@3.2.1

[uno_base]
platform = atmelavr@5.3.0
board = uno
lib_deps = arduino-libraries/Servo@1.3.0

; main firmware (line protocol for the MCP server)
[env:esp32]
extends = esp32_base
build_src_filter = +<*> -<servotest/> -<servoloop/> -<idle/>

[env:uno]
extends = uno_base
build_src_filter = +<*> -<servotest/> -<servoloop/> -<idle/>

; standalone servo movement test (serial monitor)
[env:servotest]
extends = esp32_base
build_src_filter = -<*> +<servotest/>

[env:servotest_uno]
extends = uno_base
build_src_filter = -<*> +<servotest/>

; standalone motor test, no computer needed: both servos sweep by themselves in a loop (flash it, then power the board)
[env:servoloop_uno]
extends = uno_base
build_src_filter = -<*> +<servoloop/>

; servos never driven (no signal): use to stop the arm safely
[env:idle_uno]
extends = uno_base
build_src_filter = -<*> +<idle/>
