[env]
framework = arduino
monitor_speed = 57600

[esp32_base]
platform = espressif32
board = esp32dev
lib_deps = madhephaestus/ESP32Servo@^3.0.5

[uno_base]
platform = atmelavr
board = uno
lib_deps = arduino-libraries/Servo@^1.2.2

; main firmware (line protocol for the MCP server)
[env:esp32]
extends = esp32_base
build_src_filter = +<*> -<servotest/> -<idle/>

[env:uno]
extends = uno_base
build_src_filter = +<*> -<servotest/> -<idle/>

; standalone servo movement test (serial monitor)
[env:servotest]
extends = esp32_base
build_src_filter = -<*> +<servotest/>

[env:servotest_uno]
extends = uno_base
build_src_filter = -<*> +<servotest/>

; servos never driven (no signal): use to stop the arm safely
[env:idle_uno]
extends = uno_base
build_src_filter = -<*> +<idle/>
