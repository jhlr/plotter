[project]
name = "penarm-agent"
version = "0.1.0"
description = "Google ADK agent that draws on paper through the penarm MCP server"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.25",
    "litellm>=1.106.2",
    "mcp<2",
]

[project.scripts]
penarm-chat = "penarm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["penarm_agent"]

[dependency-groups]
dev = ["mypy>=1.10"]

[tool.mypy]
strict = true
